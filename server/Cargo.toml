[package]
name = "p4fleet"
version = "0.1.0"
edition = "2021"
description = "Fleet manager for ESP32-P4 devices: discovery, health, staged OTA rollouts"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
hex = "0.4"
mdns-sd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
